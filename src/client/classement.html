<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agar-ancienne — Classement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
        html, body { margin: 0; height: 100%; background: #0f1419; color: #fff; }
        body { display: flex; flex-direction: column; padding: 24px; gap: 16px; }
        header { display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 36px; letter-spacing: 3px; color: #2ecc71; }
        #clock { text-align: right; }
        #state { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; }
        #time { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
        #time.urgent { color: #ff6b6b; }
        #snap { font-size: 14px; opacity: 0.7; }
        main { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 8px 32px; align-content: start; }
        .row { display: grid; grid-template-columns: 48px 1fr 90px 60px 90px; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 6px; font-size: 20px; }
        .row.head { grid-column: 1 / -1; background: none; font-size: 13px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .row.dead { opacity: 0.45; }
        .row:nth-child(2) { background: rgba(255, 209, 102, 0.25); }
        .row:nth-child(3) { background: rgba(192, 192, 192, 0.2); }
        .row:nth-child(4) { background: rgba(205, 127, 50, 0.2); }
        .rank { font-weight: 800; }
        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        footer { font-size: 14px; opacity: 0.6; display: flex; justify-content: space-between; }
        #winner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(0,0,0,0.85); z-index: 2; }
        #winner.show { display: flex; }
        #winner h2 { font-size: 28px; opacity: 0.8; margin: 0; }
        #winner .big { font-size: 96px; font-weight: 900; color: #ffd166; margin: 8px 0; }
        #winner p { font-size: 24px; margin: 0 0 24px; }
        #winner button { padding: 10px 24px; font-size: 18px; border: 0; border-radius: 6px; background: #2ecc71; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>AGAR-ANCIENNE</h1>
            <div id="players"></div>
        </div>
        <div id="clock">
            <div id="state">—</div>
            <div id="time">--:--</div>
            <div id="snap"></div>
        </div>
    </header>
    <main id="board"></main>
    <footer>
        <span id="formula"></span>
        <span>Score = snapshots + masse finale + kills</span>
    </footer>
    <div id="winner">
        <h2>Vainqueur</h2>
        <div class="big" id="winner-name"></div>
        <p id="winner-score"></p>
        <button id="winner-close">Voir le classement complet</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/board.js"></script>
</body>
</html>

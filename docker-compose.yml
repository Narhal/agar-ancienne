services:
  agar-ancienne:
    build: .
    container_name: agar-ancienne
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # Mot de passe admin (commande -login en jeu et page /admin). CHANGEZ-LE.
      ADMIN_PASS: ${ADMIN_PASS:-changez-moi}
      GAME_DURATION_MIN: ${GAME_DURATION_MIN:-15}
      SNAPSHOT_INTERVAL_SEC: ${SNAPSHOT_INTERVAL_SEC:-60}
      # somme | moyenne | rangs
      SCORE_FORMULA: ${SCORE_FORMULA:-rangs}
      SNAPSHOT_WEIGHT: ${SNAPSHOT_WEIGHT:-1}
      FINAL_MASS_WEIGHT: ${FINAL_MASS_WEIGHT:-1}
      KILL_VALUE: ${KILL_VALUE:-50}
      RANK_POINTS: ${RANK_POINTS:-25,18,15,12,10,8,6,4,2,1}
      RECALL_COOLDOWN_SEC: ${RECALL_COOLDOWN_SEC:-8}
      RECALL_DURATION_SEC: ${RECALL_DURATION_SEC:-2.5}
      RECONNECT_GRACE_SEC: ${RECONNECT_GRACE_SEC:-10}
      GAME_WIDTH: ${GAME_WIDTH:-5000}
      GAME_HEIGHT: ${GAME_HEIGHT:-5000}
    volumes:
      # Exports de fin de partie (JSON + CSV), lisibles depuis l'hôte.
      - ./parties:/parties
      # Base SQLite (historique des parties, chat, tentatives admin).
      - agar-ancienne-data:/data

volumes:
  agar-ancienne-data:
